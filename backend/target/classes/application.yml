server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: medikiosk-backend
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Application AI & Integration Settings
medikiosk:
  security:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    provider: mock # Options: mock, gemini, openai
    gemini:
      api-key: ${GEMINI_API_KEY:mock-key}
      model: gemini-1.5-pro
  abdm:
    mode: mock # Mock ABDM integration for SIH demo
    facility-id: IN-MH-AIIA-0021
    facility-name: All India Institute of Ayurveda, New Delhi
  his:
    mode: mock
    endpoint: http://localhost:8080/api/mock-his
